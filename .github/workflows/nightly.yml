name: native Windows startup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - name: complete original 34-row Windows shard with failure diagnostics
        shell: bash
        run: go run ./internal/devtools/hsmatrix runtime-run -t 3 -shard 1/4 -out "$RUNNER_TEMP/runtime-matrix" -timeout 20m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: runtime-windows-startup-diagnostic
          path: ${{ runner.temp }}/runtime-matrix
          retention-days: 14
