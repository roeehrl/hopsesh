name: native qualification diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: all
        options: [all, scheduler, codex-cleanup, git-probe, runtime-startup, pty-flow, relay-forks, ssh-drain, relay-reconcile, ci-shards, relay-notifications]
permissions:
  contents: read
jobs:
  scheduler:
    if: inputs.target == 'all' || inputs.target == 'scheduler'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: bundled pseudoconsole matches the broad CI environment
        shell: pwsh
        run: |
          go run ./internal/devtools/conptyfetch -arch amd64 -out "$env:RUNNER_TEMP/conpty"
          "HOPSESH_CONPTY_DIR=$env:RUNNER_TEMP/conpty" >> $env:GITHUB_ENV
      - name: build instrumented native probe
        run: go test -c -race -o scheduler-diagnostic.exe ./internal/core/runtime
      - name: cold native scheduler query
        shell: pwsh
        run: |
          & .\scheduler-diagnostic.exe '-test.run=^TestSchedulerPhaseDiagnostic$' '-test.v' '-test.count=3' '-test.timeout=1m' 2>&1 | Tee-Object scheduler-cold.log
          if ($LASTEXITCODE -ne 0) { throw 'Cold scheduler diagnostic failed' }
      - name: scheduler during broad race suite
        if: always()
        shell: pwsh
        run: |
          $suite = Start-Process go -ArgumentList @('test','-race','-count=1','-timeout','25m','./...') -RedirectStandardOutput broad-race.log -RedirectStandardError broad-race-error.log -PassThru
          $probeExit = 0
          for ($i = 0; $i -lt 45; $i++) {
            & .\scheduler-diagnostic.exe '-test.run=^TestSchedulerPhaseDiagnostic$' '-test.v' '-test.count=1' '-test.timeout=30s' 2>&1 | Tee-Object -Append scheduler-loaded.log
            if ($LASTEXITCODE -ne 0) { $probeExit = 1 }
            Start-Sleep -Seconds 5
          }
          $suite.WaitForExit()
          if ($probeExit -ne 0 -or $suite.ExitCode -ne 0) { throw "Native diagnostic failed: probe=$probeExit suite=$($suite.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scheduler-diagnostics
          path: '*.log'
          retention-days: 7
  codex-cleanup:
    if: inputs.target == 'all' || inputs.target == 'codex-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install -g --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
      - run: codex --version
      - run: go test -c -o /tmp/hopsesh-agent-diagnostic ./internal/e2e
      - name: record owned vendor process lifetime
        run: python3 scripts/diagnose-codex-cleanup.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: codex-cleanup-diagnostics
          path: codex-cleanup.*
          retention-days: 7
  git-probe:
    if: inputs.target == 'git-probe'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: native PowerShell parent
        shell: pwsh
        run: |
          go test -race -count=1 -v -timeout 3m ./internal/core/repos 2>&1 | Tee-Object git-pwsh.log
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell parent probe failed' }
      - name: native Bash parent matching primary CI
        if: always()
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -v -timeout 3m ./internal/core/repos 2>&1 | tee git-bash.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: git-probe-diagnostics
          path: 'git-*.log'
          retention-days: 7

  runtime-startup:
    if: inputs.target == 'runtime-startup'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - name: record full shard and independent startup samples without retries
        shell: bash
        run: |
          failure=0
          if ! go run ./internal/devtools/hsmatrix runtime-run -t 3 -shard 4/4 -out "$RUNNER_TEMP/startup/shard" -timeout 20m; then
            failure=1
          fi
          for sample in 1 2 3 4 5; do
            if ! go run ./internal/devtools/hsmatrix runtime-run -t 3 -only 457 -out "$RUNNER_TEMP/startup/sample-$sample" -timeout 3m; then
              failure=1
            fi
          done
          exit "$failure"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: runtime-startup-diagnostics
          path: ${{ runner.temp }}/startup
          retention-days: 7

  pty-flow:
    if: inputs.target == 'pty-flow'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: bundled pseudoconsole matches the broad CI environment
        shell: pwsh
        run: |
          go run ./internal/devtools/conptyfetch -arch amd64 -out "$env:RUNNER_TEMP/conpty"
          "HOPSESH_CONPTY_DIR=$env:RUNNER_TEMP/conpty" >> $env:GITHUB_ENV
      - run: go vet ./...
      - name: flow progress under actual broad-suite concurrency
        shell: bash
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --format github-actions \
            --jsonfile pty-flow-broad.jsonl --junitfile pty-flow-broad.xml \
            --packages ./... -- -race -count=1 -timeout 25m 2>&1 | tee pty-flow-broad.log
      - name: independent focused flow samples
        if: always()
        shell: bash
        run: |
          go test -race -count=3 -run '^TestFlowControl$' -v -timeout 4m ./internal/core/pty 2>&1 | tee pty-flow-focused.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pty-flow-diagnostics
          path: |
            pty-flow-*.log
            pty-flow-*.jsonl
            pty-flow-*.xml
          retention-days: 7

  relay-forks:
    if: inputs.target == 'relay-forks'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - name: independent fork samples with original fixture deadline
        shell: bash
        env:
          HOPSESH_RELAY_PLATFORM: '1'
        run: |
          go test -race -count=3 -v -timeout 8m -run '^TestRelayLineageSQLiteR2$/^pull$/^independent-original-and-sibling-forks$' ./internal/e2e 2>&1 | tee relay-forks.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: relay-forks-diagnostics
          path: relay-forks.log
          retention-days: 7

  ssh-drain:
    if: inputs.target == 'ssh-drain'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: native transport race suite without retries
        shell: bash
        run: go test -race -count=1 -v -timeout 8m ./internal/core/transport 2>&1 | tee ssh-drain.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ssh-drain-${{ matrix.os }}
          path: ssh-drain.log
          retention-days: 7

  relay-reconcile:
    if: inputs.target == 'relay-reconcile'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: native relay race suite without retries
        shell: bash
        run: go test -race -count=1 -v -timeout 8m ./internal/core/relay 2>&1 | tee relay-reconcile.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: relay-reconcile-${{ matrix.os }}
          path: relay-reconcile.log
          retention-days: 7

  scenarios:
    if: inputs.target == 'ci-shards'
    name: scenarios (${{ matrix.family }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    # Windows exceeded the shared 45m job budget after 76 passing rows.
    # Partition every row; keep stateful suites once and all scenario deadlines.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: windows, os: windows-2025, shard: 1/4}
          - {family: windows, os: windows-2025, shard: 2/4}
          - {family: windows, os: windows-2025, shard: 3/4}
          - {family: windows, os: windows-2025, shard: 4/4}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os != 'Windows' # its Windows agent floods the log with PID-reuse warnings
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build hopsesh, the matrix runner and the stand-in agents
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          go build -o "bin/hopsesh$ext" ./cmd/hopsesh
          go build -o "bin/hsmatrix$ext" ./internal/devtools/hsmatrix
          go build -o "bin/fakeagent$ext" ./internal/devtools/fakeagent
      # These durable-write suites can exceed one shared ten-minute deadline on
      # Windows. Keep every route and the race detector, with bounded batches.
      - name: mandatory stateful movement and instruction routes
        if: ${{ !matrix.shard || matrix.shard == '1/4' }}
        shell: bash
        run: |
          go test ./internal/e2e -run 'TestMovement|TestInstruction' -race -count=1 -timeout 10m
      - name: mandatory lineage and context routes, forks and recovery
        if: ${{ !matrix.shard || matrix.shard == '1/4' }}
        shell: bash
        run: |
          go test ./internal/e2e -run 'TestLineage|TestContext' -race -count=1 -timeout 10m
      - name: mandatory account routes and progressive discovery
        if: ${{ !matrix.shard || matrix.shard == '1/4' }}
        shell: bash
        run: |
          go test ./internal/e2e -run 'TestAccountProfile|TestSessionDiscovery' -race -count=1 -timeout 10m
      - name: mandatory account, notice-hook and discovery scenarios
        if: ${{ !matrix.shard || matrix.shard == '1/4' }}
        shell: bash
        run: |
          go test ./internal/e2e/scenario -run 'TestScenarios/(accounts|notice-hook|session-discovery)' -race -count=1 -timeout 3m
      - name: scenario matrix over loopback SSH
        if: runner.os != 'Windows'
        run: scripts/matrix-loopback.sh bin "${{ matrix.family }}→${{ matrix.family }}" "$RUNNER_TEMP/hsmatrix"
      - name: scenario matrix over loopback SSH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
        run: ./scripts/matrix-loopback.ps1 -Bin bin -Label "windows→windows $env:SHARD" -Out "$env:RUNNER_TEMP\hsmatrix" -Shard $env:SHARD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scenarios-${{ matrix.family }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/hsmatrix/*.log
            ${{ runner.temp }}/hsmatrix/*.json
          retention-days: 7


  matrix-triples:
    if: inputs.target == 'ci-shards'
    name: scenario matrix, every triple (linux ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Two shards plus the mandatory stateful suite exceeded 60m while rows
    # continued passing. Four disjoint shards retain every triple and deadline.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          for p in cmd/hopsesh:hopsesh internal/devtools/hsmatrix:hsmatrix internal/devtools/fakeagent:fakeagent; do
            go build -o "bin/${p#*:}" "./${p%%:*}"
          done
      - name: stateful movement, account and lineage routes and recovery
        if: matrix.shard == 1 # these stateful tests run once; only the matrix rows are sharded
        env:
          HOPSESH_LINEAGE_NIGHTLY: "1"
        run: go test ./internal/e2e -run 'TestMovement|TestLineage|TestAccountProfile|TestContext' -race -count=1 -timeout 12m
      - run: scripts/matrix-loopback.sh bin "linux→linux, covering triples $SHARD" "$RUNNER_TEMP/hsmatrix" -t 3 -shard "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-matrix-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/hsmatrix/*.log
            ${{ runner.temp }}/hsmatrix/*.json
          retention-days: 7

  relay-notifications:
    if: inputs.target == 'relay-notifications'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - run: npm test
        working-directory: infrastructure/relay
      - name: actual SQLite notification recovery and every named lineage route
        shell: bash
        env:
          HOPSESH_RELAY_PLATFORM: '1'
        run: |
          go test -race -count=1 -v -timeout 15m -run '^TestRelay(NotificationRecoverySQLiteR2|LineageSQLiteR2)$' ./internal/e2e 2>&1 | tee relay-notifications.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: relay-notifications-${{ matrix.os }}
          path: relay-notifications.log
          retention-days: 7
