name: native qualification diagnostics
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: all
        options: [all, scheduler, codex-cleanup, git-probe]
permissions:
  contents: read
jobs:
  scheduler:
    if: inputs.target == 'all' || inputs.target == 'scheduler'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: bundled pseudoconsole matches the broad CI environment
        shell: pwsh
        run: |
          go run ./internal/devtools/conptyfetch -arch amd64 -out "$env:RUNNER_TEMP/conpty"
          "HOPSESH_CONPTY_DIR=$env:RUNNER_TEMP/conpty" >> $env:GITHUB_ENV
      - name: build instrumented native probe
        run: go test -c -race -o scheduler-diagnostic.exe ./internal/core/runtime
      - name: cold native scheduler query
        shell: pwsh
        run: |
          & .\scheduler-diagnostic.exe '-test.run=^TestSchedulerPhaseDiagnostic$' '-test.v' '-test.count=3' '-test.timeout=1m' 2>&1 | Tee-Object scheduler-cold.log
          if ($LASTEXITCODE -ne 0) { throw 'Cold scheduler diagnostic failed' }
      - name: scheduler during broad race suite
        if: always()
        shell: pwsh
        run: |
          $suite = Start-Process go -ArgumentList @('test','-race','-count=1','-timeout','25m','./...') -RedirectStandardOutput broad-race.log -RedirectStandardError broad-race-error.log -PassThru
          $probeExit = 0
          for ($i = 0; $i -lt 45; $i++) {
            & .\scheduler-diagnostic.exe '-test.run=^TestSchedulerPhaseDiagnostic$' '-test.v' '-test.count=1' '-test.timeout=30s' 2>&1 | Tee-Object -Append scheduler-loaded.log
            if ($LASTEXITCODE -ne 0) { $probeExit = 1 }
            Start-Sleep -Seconds 5
          }
          $suite.WaitForExit()
          if ($probeExit -ne 0 -or $suite.ExitCode -ne 0) { throw "Native diagnostic failed: probe=$probeExit suite=$($suite.ExitCode)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scheduler-diagnostics
          path: '*.log'
          retention-days: 7
  codex-cleanup:
    if: inputs.target == 'all' || inputs.target == 'codex-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install -g --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
      - run: codex --version
      - run: go test -c -o /tmp/hopsesh-agent-diagnostic ./internal/e2e
      - name: record owned vendor process lifetime
        run: python3 scripts/diagnose-codex-cleanup.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: codex-cleanup-diagnostics
          path: codex-cleanup.*
          retention-days: 7
  git-probe:
    if: inputs.target == 'git-probe'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: native PowerShell parent
        shell: pwsh
        run: |
          go test -race -count=1 -v -run 'TestProbeWindowsShellDiagnostic|TestProbeLocalSlowFolder|TestProbeCancellationStopsChildren' -timeout 3m ./internal/core/repos 2>&1 | Tee-Object git-pwsh.log
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell parent probe failed' }
      - name: native Bash parent matching primary CI
        if: always()
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -v -run 'TestProbeWindowsShellDiagnostic|TestProbeLocalSlowFolder|TestProbeCancellationStopsChildren' -timeout 3m ./internal/core/repos 2>&1 | tee git-bash.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: git-probe-diagnostics
          path: 'git-*.log'
          retention-days: 7
