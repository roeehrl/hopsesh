name: nightly
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pty-progress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terminal:
    name: Windows flow control with bounded failure diagnostics
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: record executed source
        run: |
          mkdir -p "$RUNNER_TEMP/qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification/source.txt"
          git status --porcelain >> "$RUNNER_TEMP/qualification/source.txt"
          git hash-object internal/core/pty/pty_test.go >> "$RUNNER_TEMP/qualification/source.txt"
      - name: fetch pinned bundled pseudoconsole
        run: go run ./internal/devtools/conptyfetch -arch amd64 -out "$RUNNER_TEMP/conpty"
      - name: three consecutive native flow cases without retries
        run: |
          export HOPSESH_CONPTY_DIR="$RUNNER_TEMP/conpty"
          go test -race -count=3 -v -run '^TestFlowControl$' -timeout 5m ./internal/core/pty 2>&1 | tee "$RUNNER_TEMP/qualification/flow.log"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pty-progress-windows
          path: ${{ runner.temp }}/qualification/
          retention-days: 7
