name: nightly
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cold-snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observation:
    name: cold inventory and SQLite relay (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, os: ubuntu-24.04}
          - {family: macos, os: macos-15}
          - {family: windows, os: windows-2025}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - name: record executed source
        run: |
          git rev-parse HEAD > source.txt
          git status --porcelain >> source.txt
          git hash-object internal/e2e/relay_observation_test.go internal/e2e/runtime_relay_resources_test.go >> source.txt
      - name: deterministic cold snapshot through native IPC
        run: go test -race -count=20 -v -run '^TestRelayFleetObservationBeforeFirstCollection$' -timeout 2m ./internal/e2e 2>&1 | tee cold-snapshot.log
      - name: unchanged SQLite relay load observation and resource workload
        env:
          HOPSESH_RELAY_REQUIRE_NODE: "1"
          HOPSESH_RELAY_PLATFORM: "1"
        run: go test -race -count=1 -v -run 'TestRelayOperatorBudgetSQLiteR2|TestRelayLoadSQLiteR2|TestRuntimeRelayThreeProfilesThreePeersSQLiteR2|TestRelayObservationChangesSQLiteR2' -timeout 5m ./internal/e2e 2>&1 | tee relay-observation.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: cold-inventory-${{ matrix.family }}
          path: |
            source.txt
            cold-snapshot.log
            relay-observation.log
          retention-days: 7
