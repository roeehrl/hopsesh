name: nightly
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-errors-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observation:
    name: storage errors and SQLite relay (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, os: ubuntu-24.04}
          - {family: macos, os: macos-15}
          - {family: windows, os: windows-2025}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - name: record executed source
        run: |
          mkdir -p "$RUNNER_TEMP/qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification/source.txt"
          git status --porcelain >> "$RUNNER_TEMP/qualification/source.txt"
          git hash-object infrastructure/relay/worker.mjs infrastructure/relay/worker.test.mjs >> "$RUNNER_TEMP/qualification/source.txt"
      - name: Worker contracts including precommit and postcommit storage failures
        run: npm test 2>&1 | tee "$RUNNER_TEMP/qualification/contracts.log"
        working-directory: infrastructure/relay
      - name: native relay transport and recovery race tests
        run: go test -race -count=1 -v -timeout 8m ./internal/core/relay 2>&1 | tee "$RUNNER_TEMP/qualification/core-relay.log"
      - name: unchanged SQLite relay load observation and resource workload
        env:
          HOPSESH_RELAY_REQUIRE_NODE: "1"
          HOPSESH_RELAY_PLATFORM: "1"
        run: go test -race -count=1 -v -run 'TestRelayOperatorBudgetSQLiteR2|TestRelayLoadSQLiteR2|TestRuntimeRelayThreeProfilesThreePeersSQLiteR2|TestRelayObservationChangesSQLiteR2' -timeout 5m ./internal/e2e 2>&1 | tee "$RUNNER_TEMP/qualification/relay-observation.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: storage-errors-${{ matrix.family }}
          path: ${{ runner.temp }}/qualification/
          retention-days: 7
