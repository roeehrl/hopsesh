name: native runtime matrix

# Reused by nightly and release qualification. Uses disposable local services
# and no credentials; provider VM qualification remains a separate live gate.
on:
  workflow_call:
    inputs:
      strength:
        type: number
        default: 3

permissions:
  contents: read

jobs:
  runtime:
    name: runtime covering t=${{ inputs.strength }} (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, os: ubuntu-24.04}
          - {family: macos, os: macos-15}
          - {family: windows, os: windows-2025}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release callers never trust another run's build cache
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: infrastructure/relay
      - name: execute selected native rows and verify coverage report
        shell: bash
        env:
          STRENGTH: ${{ inputs.strength }}
        run: go run ./internal/devtools/hsmatrix runtime-run -t "$STRENGTH" -out "$RUNNER_TEMP/runtime-matrix" -timeout 20m
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: runtime-triples-${{ matrix.family }}
          path: ${{ runner.temp }}/runtime-matrix
          retention-days: 14
