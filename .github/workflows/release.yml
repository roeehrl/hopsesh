name: release

# A v* tag builds the Linux and Windows files, attests them and creates a DRAFT release.
# No signing key or Apple credential is used here: the maintainer completes the draft on
# their Mac with scripts/release-sign.sh (macOS files, checksums.txt and its signature),
# then publishes it. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the draft release
  id-token: write     # build provenance
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOPSESH_RELEASE_PUBKEY: ${{ vars.HOPSESH_RELEASE_PUBKEY }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      # Provenance for every file this job built; scripts/release-sign.sh checks it with
      # `gh attestation verify` before it signs checksums.txt.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
