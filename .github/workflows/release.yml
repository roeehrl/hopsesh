name: release

# A v* tag builds the Linux and Windows files (the CLI, and the Windows app with its
# installer) and the test bundle, attests them and creates a DRAFT release.
# No signing key or Apple credential is used here: the maintainer completes the draft on
# their Mac with scripts/release-sign.sh (macOS files, checksums.txt and its signature),
# then publishes it. See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the draft release
      id-token: write     # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release never builds from a cache another run could have filled
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Release notes are this version's section of CHANGELOG.md.
      - name: release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f=1; next} /^## |^\[[0-9]/ {if (f) exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            case "$v" in
              *-*) echo "Pre-release for testing the release pipeline." > "$RUNNER_TEMP/notes.md" ;;
              *) echo "::error::CHANGELOG.md has no section for $v"; exit 1 ;;
            esac
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOPSESH_RELEASE_PUBKEY: ${{ vars.HOPSESH_RELEASE_PUBKEY }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Windows app (app zip and installer, amd64 and arm64)
        env:
          HOPSESH_RELEASE_PUBKEY: ${{ vars.HOPSESH_RELEASE_PUBKEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: dist/windows
        run: |
          sudo apt-get update && sudo apt-get install -y nsis zip
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" scripts/build-windows-app.sh
          # Versionless copies, so .../releases/latest/download/... always serves the newest.
          for arch in amd64 arm64; do
            cp "dist/windows/hopsesh-$VERSION-windows-$arch-setup.exe" "dist/windows/hopsesh-windows-$arch-setup.exe"
          done
          gh release upload "$GITHUB_REF_NAME" dist/windows/*.zip dist/windows/*.exe --repo "$GITHUB_REPOSITORY"
      - name: test bundle (stand-in agents, fixtures and contributed payloads; testbundle/README.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go run ./internal/devtools/testbundle build -version "$VERSION" -out dist/testbundle
          gh release upload "$GITHUB_REF_NAME" dist/testbundle/* --repo "$GITHUB_REPOSITORY"
      # Provenance for every file this job built; scripts/release-sign.sh checks it with
      # `gh attestation verify` before it signs checksums.txt.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/windows/*.zip
            dist/windows/*.exe
            dist/testbundle/*.tar.gz
