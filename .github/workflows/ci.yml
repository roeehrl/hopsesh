name: ci

# Every job here needs no secret and writes nothing outside its own runner, so it runs on
# any pull request, forks included (outside contributors' runs wait for approval).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, os: ubuntu-24.04}
          - {family: macos, os: macos-15}
          - {family: windows, os: windows-2025}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        run: >-
          go run gotest.tools/gotestsum@v1.13.0 --format github-actions
          --junitfile "junit-${{ matrix.family }}.xml" --rerun-fails=2 --rerun-fails-report reruns.txt
          --packages ./... -- -race -count=1
      - name: test summary
        if: ${{ !cancelled() }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: junit-${{ matrix.family }}.xml
      - name: tests that passed only on a rerun
        if: ${{ !cancelled() && hashFiles('reruns.txt') != '' }}
        shell: bash
        run: '{ echo "### Passed on a rerun (flaky)"; sed "s/^/- /" reruns.txt; } >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.family }}
          path: junit-${{ matrix.family }}.xml
          retention-days: 7
      - name: build
        run: go build -trimpath ./cmd/hopsesh

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  workflows:
    name: workflow audit
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  gui:
    name: gui (browser)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: internal/devtools/webtest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/devtools/webtest/package-lock.json
      - name: GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: window tests (Chromium and WebKit, the real service on a demo home)
        run: npx playwright test
      - name: test summary
        if: ${{ !cancelled() }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: internal/devtools/webtest/test-results/junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: gui-report
          path: |
            internal/devtools/webtest/playwright-report/
            internal/devtools/webtest/test-results/
          retention-days: 7

  ssh:
    name: ssh (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, os: ubuntu-24.04}
          - {family: macos, os: macos-15}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/hopsesh ./cmd/hopsesh
      - run: scripts/integration-test.sh
      - run: scripts/roundtrip-test.sh
      - run: scripts/password-test.sh

  scenarios:
    name: scenarios (${{ matrix.family }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {family: linux, os: ubuntu-24.04}
          - {family: macos, os: macos-15}
          - {family: windows, os: windows-2025}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build hopsesh, the matrix runner and the stand-in agents
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          go build -o "bin/hopsesh$ext" ./cmd/hopsesh
          go build -o "bin/hsmatrix$ext" ./internal/devtools/hsmatrix
          go build -o "bin/fakeagent$ext" ./internal/devtools/fakeagent
      - name: scenario matrix over loopback SSH
        if: runner.os != 'Windows'
        run: scripts/matrix-loopback.sh bin "${{ matrix.family }}→${{ matrix.family }}" "$RUNNER_TEMP/hsmatrix"
      - name: scenario matrix over loopback SSH
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/matrix-loopback.ps1 -Bin bin -Label "windows→windows" -Out "$env:RUNNER_TEMP\hsmatrix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: scenarios-${{ matrix.family }}
          path: |
            ${{ runner.temp }}/hsmatrix/*.log
            ${{ runner.temp }}/hsmatrix/*.json
          retention-days: 7

  os-pairs-windows-linux:
    name: os pairs (windows↔linux)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build for Windows and for Linux
        shell: bash
        run: |
          for p in cmd/hopsesh:hopsesh internal/devtools/hsmatrix:hsmatrix internal/devtools/fakeagent:fakeagent; do
            go build -o "bin/${p#*:}.exe" "./${p%%:*}"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "bin-linux/${p#*:}" "./${p%%:*}"
          done
      - name: scenario matrix, Windows → Linux (WSL2) and Linux → Windows
        shell: pwsh
        run: ./scripts/matrix-wsl.ps1 -Bin bin -LinuxBin bin-linux -Out "$env:RUNNER_TEMP\hsmatrix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: os-pairs-windows-linux
          path: ${{ runner.temp }}/hsmatrix/
          retention-days: 7

  os-pairs-macos-linux:
    name: os pairs (macos↔linux)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build for macOS and for Linux
        run: |
          for p in cmd/hopsesh:hopsesh internal/devtools/hsmatrix:hsmatrix internal/devtools/fakeagent:fakeagent; do
            go build -o "bin/${p#*:}" "./${p%%:*}"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "bin-linux/${p#*:}" "./${p%%:*}"
          done
      - name: scenario matrix, macOS → Linux (Lima VM) and Linux → macOS
        run: scripts/matrix-lima.sh bin bin-linux "$RUNNER_TEMP/hsmatrix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: os-pairs-macos-linux
          path: ${{ runner.temp }}/hsmatrix/
          retention-days: 7

  windows-peer:
    name: ssh (windows)
    runs-on: windows-2025
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o bin/hopsesh.exe ./cmd/hopsesh
      - shell: pwsh
        run: ./scripts/windows-peer-test.ps1 -Bin bin/hopsesh.exe

  windows-app-build:
    name: windows app (build)
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: build the app, its zip and the installer (amd64 and arm64)
        env:
          VERSION: 0.0.0-ci
        run: scripts/build-windows-app.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-app
          path: dist/windows/
          retention-days: 7

  windows-app:
    name: windows app (install, real window)
    needs: windows-app-build
    runs-on: windows-2025
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/devtools/webtest/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-app
          path: dist/windows
      - name: install, start, reinstall and uninstall
        shell: pwsh
        run: ./scripts/windows-app-test.ps1 -Setup dist/windows/hopsesh-0.0.0-ci-windows-amd64-setup.exe -Version 0.0.0-ci
      - name: screenshots of the installer's pages (run interactively)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/windows-installer-shots.ps1 -Setup dist/windows/hopsesh-0.0.0-ci-windows-amd64-setup.exe -Out "$env:RUNNER_TEMP\installer-shots"
      - name: upload the installer screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-shots
          path: ${{ runner.temp }}/installer-shots/
          retention-days: 30
          if-no-files-found: ignore
      - name: test build of the app (debugging port; never released)
        shell: pwsh
        run: |
          go run ./internal/devtools/icon "$env:RUNNER_TEMP/icon.png"
          go run ./internal/devtools/winres -icon "$env:RUNNER_TEMP/icon.png" -arch amd64 -version 0.3.0 -out cmd/hopsesh-app/rsrc_windows_amd64.syso
          # The release public key, so the app offers to install updates (the shots show it).
          $key = (Get-Content packaging/release-key.pub | Where-Object { $_ -notmatch '-----' }) -join ''
          go build -tags e2e -ldflags "-H windowsgui -X github.com/roeehrl/hopsesh/internal/version.Version=0.3.0 -X github.com/roeehrl/hopsesh/internal/update.PublicKey=$key" -o "$env:RUNNER_TEMP/e2e/hopsesh-app.exe" ./cmd/hopsesh-app
          go build -o "$env:RUNNER_TEMP/e2e/hopsesh.exe" ./cmd/hopsesh
      - name: the real window (WebView2 driven over CDP)
        shell: pwsh
        working-directory: internal/devtools/webtest
        run: |
          npm ci
          $env:HOPSESH_APP_EXE = "$env:RUNNER_TEMP/e2e/hopsesh-app.exe"
          npx playwright test -c playwright.real.config.ts real/app.spec.ts
      - name: studio for the screenshots (WSL2 Ubuntu over SSH)
        shell: pwsh
        run: ./scripts/windows-demo-studio.ps1 -Key "$env:RUNNER_TEMP\demo-ssh\id_ed25519" -SshConfig "$env:RUNNER_TEMP\demo-ssh\config"
      - name: screenshots of the real window (the made-up laptop)
        shell: pwsh
        working-directory: internal/devtools/webtest
        run: |
          $env:HOPSESH_APP_EXE = "$env:RUNNER_TEMP/e2e/hopsesh-app.exe"
          $env:DEMO_SSH_CONFIG = "$env:RUNNER_TEMP\demo-ssh\config"
          $env:HOPSESH_DEMO_WORLD = "laptop"
          $env:HOPSESH_DEMO_HOME = "C:\Users\alice"
          $env:SHOTS_DIR = "$env:RUNNER_TEMP/windows-shots"
          npx playwright test -c playwright.real.config.ts real/shots.spec.ts
      - name: upload the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-shots
          path: ${{ runner.temp }}/windows-shots/
          retention-days: 30
      - name: test summary
        if: ${{ !cancelled() }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: internal/devtools/webtest/test-results/junit-real.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: windows-app-report
          path: |
            internal/devtools/webtest/playwright-report-real/
            internal/devtools/webtest/test-results/
          retention-days: 7

  install-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh demo/*.sh
      - shell: pwsh
        run: |
          foreach ($f in 'scripts/install.ps1', 'scripts/windows-app-test.ps1', 'scripts/windows-peer-test.ps1', 'scripts/windows-demo-studio.ps1', 'scripts/matrix-loopback.ps1', 'scripts/matrix-wsl.ps1', 'scripts/windows-installer-shots.ps1') {
            $null = [ScriptBlock]::Create((Get-Content -Raw $f))
          }

  release-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # goreleaser only checks its configuration here
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
