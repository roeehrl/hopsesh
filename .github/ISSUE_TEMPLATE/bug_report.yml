name: Bug report
description: Something didn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please never paste transcript contents, tokens or keys here. Redact paths if you prefer.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: hopsesh version (`hopsesh version`)
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version on each machine (`claude --version`)
  - type: input
    id: os
    attributes:
      label: Operating systems (this machine → other machine)
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options: [Command line (hopsesh ls / pull / …), Terminal UI (hopsesh), macOS app, Install or update]
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: How does this machine reach the other one?
      options: [Tailscale, "~/.ssh/config alias", Plain user@host, Not sure]
  - type: textarea
    id: doctor
    attributes:
      label: Output of `hopsesh doctor <machine>`
      description: Redact host names or paths if you prefer.
      render: text
