# GoReleaser configuration for the hopsesh CLI on Linux and Windows.
#
# CI builds these from a v* tag and creates a draft release. The macOS files (CLI
# archives and the app), the final checksums.txt and its signature are made on the
# maintainer's Mac by scripts/release-sign.sh, so no signing key or Apple credential is
# ever stored in GitHub (docs/RELEASING.md).
#
# Optional: TAP_GITHUB_TOKEN publishes the Scoop manifest and the winget pull request.
version: 2

project_name: hopsesh

before:
  hooks:
    - go mod tidy

builds:
  - id: hopsesh
    main: ./cmd/hopsesh
    binary: hopsesh
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/roeehrl/hopsesh/internal/version.Version={{.Version}}
      - -X github.com/roeehrl/hopsesh/internal/version.Commit={{.ShortCommit}}
      - -X github.com/roeehrl/hopsesh/internal/version.Date={{.Date}}
      - -X github.com/roeehrl/hopsesh/internal/update.PublicKey={{ envOrDefault "HOPSESH_RELEASE_PUBKEY" "" }}

archives:
  - id: default
    # internal/update.ArchiveName depends on this exact pattern.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  disable: true # scripts/release-sign.sh writes and signs the complete checksums.txt

sboms:
  - artifacts: archive

nfpms:
  - id: packages
    package_name: hopsesh
    vendor: hopsesh contributors
    homepage: https://github.com/roeehrl/hopsesh
    maintainer: roeehrl <82368940+roeehrl@users.noreply.github.com>
    description: Move Claude Code sessions between your machines (not affiliated with Anthropic).
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    dependencies: [openssh-client]
    overrides:
      rpm:
        dependencies: [openssh-clients]
      apk:
        dependencies: [openssh-client]

scoops:
  - name: hopsesh
    ids: [default]
    repository:
      owner: roeehrl
      name: scoop-bucket
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/roeehrl/hopsesh
    description: Move Claude Code sessions between your machines
    license: Apache-2.0
    skip_upload: '{{ if isEnvSet "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

winget:
  - name: hopsesh
    publisher: roeehrl
    short_description: Move Claude Code sessions between your machines
    license: Apache-2.0
    homepage: https://github.com/roeehrl/hopsesh
    publisher_url: https://github.com/roeehrl
    ids: [default]
    repository:
      owner: roeehrl
      name: winget-pkgs
      branch: "hopsesh-{{ .Version }}"
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if isEnvSet "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

# Release notes are this version's CHANGELOG.md section, passed with --release-notes (see
# release.yml), which replaces GoReleaser's own changelog. "changelog: disable: true" would
# drop those notes too.

release:
  draft: true # scripts/release-sign.sh completes it; a person publishes it
  footer: |
    ## Install

    macOS and Linux: `curl -fsSL https://raw.githubusercontent.com/roeehrl/hopsesh/main/scripts/install.sh | sh`

    Windows (PowerShell): `irm https://raw.githubusercontent.com/roeehrl/hopsesh/main/scripts/install.ps1 | iex`

    macOS app: the `.dmg` below (signed and notarized; macOS 13 or later). Windows app: the `-setup.exe` below for your processor (amd64 or arm64; installs for you only, no administrator rights). It is not code-signed yet, so Windows SmartScreen asks first: More info, then Run anyway. On Windows 11 with Smart App Control on, Windows blocks programs that aren't code-signed, so the app won't run there until it is. Linux: `.deb`, `.rpm`, `.apk` below. Both apps update themselves; from the command line, `hopsesh update`.

    ## Verify

    `openssl dgst -sha256 -verify release-key.pub -signature checksums.txt.sig checksums.txt`, then
    `shasum -a 256 -c checksums.txt --ignore-missing`, with
    [release-key.pub](https://github.com/roeehrl/hopsesh/blob/main/packaging/release-key.pub).
    Linux and Windows files also carry build provenance: `gh attestation verify <file> --repo roeehrl/hopsesh`.

    hopsesh is an independent project and is not affiliated with, endorsed by or sponsored by Anthropic or OpenAI.
