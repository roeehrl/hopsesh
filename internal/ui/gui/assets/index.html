<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopsesh</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="/quick.css">
</head>
<body>
<header class="titlebar" style="--wails-draggable: drag">
  <button id="btn-back-sessions" class="btn nav-back" style="--wails-draggable: no-drag" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg>
    Back to sessions
  </button>
  <button id="btn-sidebar" class="btn icon pane-btn" style="--wails-draggable: no-drag" aria-controls="sidebar" aria-expanded="true" aria-label="Hide sidebar" title="Hide Sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5v15M5.5 8.5h1.5M5.5 11.5h1.5"/></svg>
  </button>
  <span class="brand">hopsesh</span>
  <span class="where" id="where"></span>
  <button id="btn-search" class="search" style="--wails-draggable: no-drag" aria-label="Search sessions or run a command" aria-keyshortcuts="Meta+K">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search sessions or run a command</span>
    <span class="kbd" style="margin-left: auto" data-keys="mod+K">⌘K</span>
  </button>
  <span class="spacer"></span>
  <span class="fresh" id="fresh" role="status" aria-live="polite"></span>
  <button id="btn-terminal" class="btn icon" style="--wails-draggable: no-drag;position:relative" aria-label="Terminal" title="Show the terminal (Ctrl+`)" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/></svg>
    <span class="term-n" hidden></span>
  </button>
  <button id="btn-refresh" class="btn icon" style="--wails-draggable: no-drag" aria-label="Refresh" title="Refresh (⌘R)" data-label="Refresh" data-keys-title="mod+R">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button id="btn-settings" class="btn icon" style="--wails-draggable: no-drag" aria-label="Settings" title="Settings (⌘,)" data-label="Settings" data-keys-title="mod+,">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.6 2.4-1.4.8-2.4-.7-2.5 4.3 1.8 1.7v1.6l-1.8 1.7 2.5 4.3 2.4-.7 1.4.8.6 2.4h5l.6-2.4 1.4-.8 2.4.7 2.5-4.3-1.8-1.7v-1.6l1.8-1.7-2.5-4.3-2.4.7-1.4-.8-.6-2.4z"/><circle cx="12" cy="12.3" r="3.2"/></svg>
  </button>
  <button id="btn-inspector" class="btn icon pane-btn" style="--wails-draggable: no-drag" aria-controls="inspector" aria-expanded="true" aria-label="Hide inspector" title="Hide Inspector">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M15 4.5v15M17 8.5h1.5M17 11.5h1.5"/></svg>
  </button>
</header>
<main id="view">
  <section id="startup" class="loading" role="status" aria-live="polite">
    <svg width="48" height="38" viewBox="248 370 528 392" aria-hidden="true" fill="currentColor" style="color:var(--accent)"><path d="M330 640 A182 230 0 0 1 694 640" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round"/><circle cx="330" cy="680" r="62"/><circle cx="694" cy="680" r="62"/></svg>
    <h1 id="startup-title" style="font-size:20px;margin:8px 0 0">Opening hopsesh…</h1>
    <p id="startup-detail" style="margin:0;max-width:440px;line-height:1.5">Loading your settings and sessions.</p>
    <button id="startup-retry" class="btn" hidden>Reload window</button>
  </section>
</main>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<dialog id="dlg" class="dlg"></dialog>
<dialog id="pwdlg" class="dlg"></dialog>
<dialog id="palette" class="palette" aria-label="Search or run a command"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="startup.js"></script>
</body>
</html>
