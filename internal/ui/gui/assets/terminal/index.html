<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hopsesh Terminal</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="terminal.css">
</head>
<body>
<header class="strip" id="strip">
  <button class="ib" id="back" title="Back to sessions (⌃`)" aria-label="Back to sessions"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18"/></svg><span class="bt">Back to sessions</span> <span class="kbd">⌃`</span></button>
  <div role="tablist" aria-label="Terminal tabs" id="tabs"></div>
  <button class="ib" id="new-shell" disabled aria-label="New shell tab" title="New shell tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <span class="spacer"></span>
<label class="workspace-label">Layout <select id="placement" aria-label="Terminal placement"><option value="bottom">Bottom panel</option><option value="right">Right panel</option><option value="separate">Separate window</option></select></label>
</header>
<label class="terminal-grouping">Group tabs <select id="terminal-grouping" aria-label="Group terminal tabs"><option value="family">Family</option><option value="session">Session</option><option value="none">None</option></select></label>
<div id="terminal-groups" class="terminal-groups" aria-label="Terminal groups"></div>
<div id="connection" role="status" aria-live="polite">Connecting to Hopsesh…</div>
<div id="banner" role="status" hidden></div>
<div class="info" id="info" hidden>
  <span class="lock" id="lock" hidden><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Not recorded</span>
  <span class="lock" id="reads" title="hopsesh reads this tab only for the session link; it never types or answers here" hidden>Reads the link only</span>
  <span class="runs" id="runs"></span>
  <div role="toolbar" aria-label="Tab actions" class="tools">
    <button class="ib" id="t-external"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span id="t-external-label">Open in my terminal</span></button>
    <button class="ib" id="t-copy" aria-label="Copy" title="Copy the selection"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></button>
    <button class="ib" id="t-find" aria-label="Find" title="Find in this tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ib" id="t-clear" aria-label="Clear" title="Clear the scrollback and screen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m16 3 5 5-11 11H5v-5z"/><path d="M9 21h11"/></svg></button>
    <button class="ib" id="t-reader" aria-label="Screen reader mode" aria-pressed="false" title="Screen reader mode"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
    <button class="ib" id="t-max" aria-label="Maximize" title="Maximize the window"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="t-close" aria-label="Close tab" title="Close tab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
<main id="stage">
  <div id="terms"></div>
  <div class="find" id="find" role="search" hidden>
    <label for="find-q" class="visually-hidden">Find in this tab</label>
    <input id="find-q" class="field" placeholder="Find in this tab" autocomplete="off" spellcheck="false">
    <span id="find-n" class="muted" aria-live="polite"></span>
    <button class="ib" id="find-prev" aria-label="Previous match"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
    <button class="ib" id="find-next" aria-label="Next match"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="ib" id="find-close" aria-label="Close find"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="empty" id="empty" hidden>
    <b>No programs are running here</b>
    <span class="muted">Resume a session, sign in to a cloud or open a shell from the hopsesh window, and it runs here. hopsesh starts the command; you do all the typing.</span>
    <button class="btn" id="empty-shell">Open a shell</button>
  </div>
</main>
<div id="note" class="note" hidden></div>
<div id="exitbar" class="exitbar" role="status" hidden></div>
<p id="tip" class="tip" hidden>Press ⌃` to move between the terminal and your sessions. <button class="link" id="tip-ok">Got it</button></p>
<div id="live" class="visually-hidden" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" class="dlg"></dialog>
<script src="/terminal/window-start.js" data-status="#connection" data-module="/terminal/terminal.js"></script>
</body>
</html>
