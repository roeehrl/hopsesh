<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#f6f5f1;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#1d1c19;display:flex}
.left{width:490px;padding:0 0 0 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:22px}
.name{display:flex;align-items:center;gap:20px;font-family:'IBM Plex Mono',monospace;font-size:58px;font-weight:500;letter-spacing:-1px}
.name img{width:84px;height:84px}
.tag{font-size:34px;line-height:1.25;font-weight:600}
.sub{font-size:21px;line-height:1.45;color:#4f4c45}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.pills span{font-size:16px;padding:6px 12px;border-radius:999px;background:#dfeeeb;color:#0b6b62;font-weight:600}
.right{flex:1;display:flex;align-items:center;padding-right:48px}
.shot{width:100%;border-radius:14px;box-shadow:0 22px 50px rgba(20,30,28,.28);border:1px solid #2a2b3c}
</style></head><body>
<div class="left">
  <div class="name"><img src="../docs/assets/logo.svg" alt="">hopsesh</div>
  <div class="tag">Continue your Claude Code session on another machine.</div>
  <div class="sub">Finds sessions on your other machines over SSH or Tailscale, then moves one here with its repo, worktree and paths fixed up.</div>
  <div class="pills"><span>CLI + TUI</span><span>macOS app</span><span>open source</span></div>
</div>
<div class="right"><img class="shot" src="out/tui-browse.png" alt=""></div>
</body></html>
